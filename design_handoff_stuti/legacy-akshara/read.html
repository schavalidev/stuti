<body data-page="read">
<div class="wrap">
  <a class="crumb" href="library.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span data-t="fLibrary">The library</span></a>
  <div class="reader-wrap" style="margin-top:22px">
    <div class="site-reader site-accent" id="reader">
      <div class="site-reader-head">
        <span class="seal" id="readerSeal"></span>
        <div style="min-width:0"><div class="t" id="readerTitle">—</div><div class="s" id="readerSub"></div></div>
        <div class="n" id="readerCount"></div>
      </div>
      <div class="site-reader-body" id="readerBody"></div>
      <div class="site-reader-foot">
        <button class="site-play" id="playBtn" aria-label="Play or pause" data-ta="playPause"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
        <button class="chip chip-ico" id="prevBtn" aria-label="Previous verse" data-ta="prevVerse"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
        <button class="chip chip-ico" id="nextBtn" aria-label="Next verse" data-ta="nextVerse"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
        <span class="site-scrub" id="scrub" title="Jump to a verse" data-tt="scrubTitle"><span id="scrubFill" style="width:0%"></span></span>
        <button class="chip" id="speedBtn" title="How fast the lines advance" data-tt="speedTitle">1.0×</button>
        <button class="chip" id="loopBtn" title="Repeat this verse" data-tt="loopTitle">loop</button>
        <button class="chip chip-lock" id="shareBtn" data-ta="shareLock" data-tt="shareLock"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span data-t="shareLbl">Share</span></button>
        <button class="chip chip-lock" id="printBtn" data-ta="printLock" data-tt="printLock"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></svg><span data-t="printLbl">Print</span></button>
      </div>
    </div>
    <div class="note" id="readerMiss" hidden style="margin-top:22px" data-th="readerMiss"><b>That link does not name a text the website carries.</b> <a href="library.html">The library lists them all</a></div>
    <div class="note note-lim" id="limNote" hidden data-th="limLockNote"></div>
    <div class="reader-nav" id="readerNav"></div>
    <div class="note" style="margin-top:26px" data-th="readerNote">Space plays and pauses; the arrow keys step verses, and the bar jumps. <a href="get.html#account">An account carries your place to the app</a></div>
  </div>
