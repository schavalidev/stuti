<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="design_doc_mode" content="canvas">
<title>Ṛtu Palette Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400..700&family=Noto+Sans:wght@400..700&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Telugu:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;font-style:normal}
body{font-family:'Noto Sans','Noto Sans Telugu',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:#8A5A18}a:hover{color:#B07A2B}
.sec{position:absolute;width:860px;color:#2B2017}
.sec h2{font-family:'Noto Serif',serif;font-weight:600;font-size:30px;letter-spacing:-.01em}
.sec .k{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#8A5A18;font-weight:600;margin-bottom:8px}
.sec p{margin-top:10px;font-size:15px;line-height:1.65;color:#584B3E;max-width:74ch;text-wrap:pretty}
.cap{position:absolute;font-size:13px;letter-spacing:.02em;color:#584B3E;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.cap .sw{width:13px;height:13px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.cap small{font-weight:400;color:#6F6356;font-size:12px}
.ph{position:absolute;width:390px;height:800px;border-radius:36px;overflow:hidden;display:flex;flex-direction:column;color:var(--ink);background:linear-gradient(180deg,var(--bw),var(--bg) 30%);box-shadow:0 34px 80px -34px rgba(40,25,8,.45),0 0 0 1px rgba(0,0,0,.06);font-size:15px}
.bar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px}
.wm{font-family:'Noto Serif','Noto Sans Telugu',serif;font-size:24px;font-weight:600;color:var(--acc)}
.ic{color:var(--soft);display:grid;place-items:center}
.sky{position:relative;height:158px;margin:6px 0 0;overflow:hidden}
.sky .sun{position:absolute;right:52px;bottom:34px;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FBE29A,#F2C05A 65%,rgba(242,192,90,0));box-shadow:0 0 26px 10px rgba(244,200,100,.45)}
.sky .moon{position:absolute;right:60px;top:30px;width:24px;height:24px;border-radius:50%;background:#EFD080;box-shadow:inset -7px -4px 0 2px rgba(20,16,10,.55)}
.sky .greet{position:absolute;left:20px;top:24px;color:#FDF8EC;font-size:17px;font-weight:600;text-shadow:0 1px 8px rgba(20,30,45,.35)}
.sky .loc{position:absolute;right:16px;top:22px;font-size:12px;color:#F2ECDD;background:rgba(30,45,66,.38);padding:4px 12px;border-radius:999px;backdrop-filter:blur(2px)}
.card{position:relative;margin:0 18px;background:var(--sf);border-radius:22px;box-shadow:0 16px 40px -20px rgba(40,25,8,.35);padding:16px 18px}
.card.over{margin-top:-52px}
.ey{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:600;color:var(--faint)}
.srow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:8px}
.srow b{font-size:20px;font-weight:600}
.srow span{font-size:16px;color:var(--soft)}
.pbar{margin-top:12px;height:5px;border-radius:3px;background:color-mix(in oklab,var(--ink) 9%,transparent);position:relative;overflow:hidden}
.pbar span{position:absolute;inset:0 auto 0 0;width:34%;border-radius:3px;background:linear-gradient(90deg,var(--acc),color-mix(in oklab,var(--acc) 60%,var(--sf)))}
.meta{display:flex;justify-content:space-between;margin-top:9px;font-size:12.5px;color:var(--faint)}
.meta .mid{color:var(--deep);font-weight:600}
.search{margin:16px 18px 0;display:flex;align-items:center;gap:10px;background:var(--sf);border-radius:999px;padding:13px 18px;color:var(--faint);font-size:15px;box-shadow:0 8px 24px -16px rgba(40,25,8,.4)}
.shelfhead{display:flex;align-items:baseline;justify-content:space-between;margin:22px 20px 10px}
.shelfhead .more{font-size:13px;color:var(--deep);font-weight:600}
.shelf{display:flex;gap:12px;margin:0 18px}
.scard{flex:1;background:var(--sf);border-radius:18px;padding:14px 15px;box-shadow:0 10px 26px -18px rgba(40,25,8,.4)}
.scard .dot{width:9px;height:9px;border-radius:50%;margin-bottom:9px}
.scard b{font-size:15.5px;font-weight:600;display:block;line-height:1.35}
.scard small{display:block;margin-top:4px;font-size:12px;color:var(--faint)}
.scard .go{margin-top:10px;display:inline-block;font-size:12px;font-weight:600;color:var(--deep);background:color-mix(in oklab,var(--acc) 13%,transparent);padding:4px 11px;border-radius:999px}
.tabs{margin-top:auto;display:flex;gap:6px;padding:10px 14px 20px;background:color-mix(in oklab,var(--sf) 78%,var(--bg));border-top:1px solid color-mix(in oklab,var(--ink) 7%,transparent)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 4px;border-radius:15px;font-size:12px;color:var(--soft)}
.tab.on{background:color-mix(in oklab,var(--acc) 15%,transparent);color:var(--deep);font-weight:600}
.lt{font-family:'Noto Serif','Noto Sans Telugu',serif;font-size:25px;font-weight:600;margin:8px 20px 0}
.chips{display:flex;gap:8px;margin:14px 18px 0;overflow:hidden}
.chip{white-space:nowrap;font-size:13.5px;padding:9px 16px;border-radius:999px;background:var(--sf);color:var(--soft);box-shadow:0 6px 18px -12px rgba(40,25,8,.4)}
.chip.on{background:color-mix(in oklab,var(--acc) 15%,var(--sf));color:var(--deep);font-weight:600;box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--acc) 45%,transparent)}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin:16px 18px 0}
.dcell{background:var(--sf);border-radius:18px;padding:13px 8px 11px;text-align:center;box-shadow:0 10px 26px -18px rgba(40,25,8,.4)}
.em{width:64px;height:64px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-family:'Noto Sans Devanagari',sans-serif;font-size:25px;font-weight:600}
.dcell b{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:var(--soft)}
.rtop{display:flex;align-items:center;gap:12px;padding:14px 18px 8px}
.rtop b{font-size:17px;font-weight:600}
.rtop small{display:block;font-size:12px;color:var(--faint);font-weight:400}
.verse{margin:14px 18px 0;background:var(--sf);border-radius:22px;padding:20px;box-shadow:0 16px 40px -20px rgba(40,25,8,.35)}
.vn{font-size:12px;font-weight:600;color:var(--deep);background:color-mix(in oklab,var(--acc) 13%,transparent);display:inline-block;padding:3px 11px;border-radius:999px}
.deva{font-family:'Noto Sans Devanagari',sans-serif;font-size:19.5px;line-height:1.8;margin-top:14px;white-space:pre-line}
.telv{font-family:'Noto Sans Telugu',sans-serif;font-size:16.5px;line-height:1.85;margin-top:14px;color:var(--soft);white-space:pre-line;border-top:1px solid color-mix(in oklab,var(--ink) 8%,transparent);padding-top:13px}
.mean{margin-top:13px;font-size:13.5px;line-height:1.6;color:var(--faint)}
.audio{margin:auto 18px 22px;display:flex;align-items:center;gap:13px;background:var(--sf);border-radius:999px;padding:11px 18px 11px 11px;box-shadow:0 14px 34px -18px rgba(40,25,8,.45)}
.play{width:44px;height:44px;border-radius:50%;background:var(--acc);display:grid;place-items:center;color:#FFFDF6;flex:none}
.audio .pbar{flex:1;margin:0}
.audio small{font-size:12px;color:var(--faint);white-space:nowrap}
</style>
</head>
<body>
<script>
const T={
 current:{bg:"#F7EFE2",bw:"#F2E6D2",sf:"#FFFDF8",ink:"#2B2017",soft:"#584B3E",faint:"#6F6356",acc:"#B07A2B",deep:"#8A5A18"},
 vasanta:{bg:"#F9ECEC",bw:"#F4DEDD",sf:"#FFFCFB",ink:"#38222A",soft:"#634753",faint:"#7C616D",acc:"#B25672",deep:"#8E3E58"},
 grisma:{bg:"#FBEED4",bw:"#F7E2B8",sf:"#FFFDF5",ink:"#382712",soft:"#634A28",faint:"#7C613E",acc:"#C97916",deep:"#9C5D0C"},
 varsa:{bg:"#ECF1F6",bw:"#DFE8F2",sf:"#FCFDFF",ink:"#1E2733",soft:"#455468",faint:"#5D6C80",acc:"#4A6B98",deep:"#37527C"},
 sarad:{bg:"#F9F1DA",bw:"#F3E6C0",sf:"#FFFEF6",ink:"#332813",soft:"#5D4E2A",faint:"#766441",acc:"#B9882A",deep:"#8F681C"},
 hemanta:{bg:"#F1EEE7",bw:"#E9E3D7",sf:"#FDFCF9",ink:"#2C2821",soft:"#575043",faint:"#6F6757",acc:"#8B7B5E",deep:"#6B5D45"},
 sisira:{bg:"#EEF3F7",bw:"#E2EAF1",sf:"#FBFDFE",ink:"#222C34",soft:"#485866",faint:"#61707E",acc:"#6E8CA6",deep:"#527089"},
 vasantaN:{bg:"#1A1013",bw:"#221318",sf:"#291A20",ink:"#F6E9EC",soft:"#CCA8B3",faint:"#A68491",acc:"#DB9BAD",deep:"#E4AFBE",night:1},
};
// Option C — parchment bones, seasonal light: current ink/surfaces, tinted ground, pigment accent
const mixC=(hue,acc,deep)=>({bg:`color-mix(in oklab, ${hue} 13%, #F7EFE2)`,bw:`color-mix(in oklab, ${hue} 22%, #F2E6D2)`,sf:"#FFFDF8",ink:"#2B2017",soft:"#584B3E",faint:"#6F6356",acc,deep});
const TC={vasanta:mixC("#D08A9C","#B05468","#8E3E58"),varsa:mixC("#46648C","#4A6B98","#37527C"),grisma:mixC("#D8932F","#C97916","#9C5D0C")};
const vars=t=>Object.entries({"--bg":t.bg,"--bw":t.bw,"--sf":t.sf,"--ink":t.ink,"--soft":t.soft,"--faint":t.faint,"--acc":t.acc,"--deep":t.deep}).map(([k,v])=>k+":"+v).join(";");
const I={
 gear:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3.4"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M18.7 5.3l-2.1 2.1M7.4 16.6l-2.1 2.1"/></svg>',
 moon:'<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>',
 srch:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
 back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14.5 5 8 12l6.5 7"/></svg>',
 play:'<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5Z"/></svg>',
 home:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 11.5 12 4.5l8 7"/><path d="M6.5 10v9.5h11V10"/></svg>',
 flower:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="6.2" rx="2.3" ry="3.1"/><ellipse cx="12" cy="17.8" rx="2.3" ry="3.1"/><ellipse cx="6.2" cy="12" rx="3.1" ry="2.3"/><ellipse cx="17.8" cy="12" rx="3.1" ry="2.3"/></svg>',
 book:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M12 6.5C10.4 5 8 4.5 4.5 4.7V18c3.5-.2 5.9.3 7.5 1.8 1.6-1.5 4-2 7.5-1.8V4.7C16 4.5 13.6 5 12 6.5Z"/><path d="M12 6.5v13"/></svg>',
 cal:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><rect x="4" y="5.5" width="16" height="14.5" rx="3"/><path d="M4 10h16M8.5 3.5v3.5M15.5 3.5v3.5"/></svg>'
};
const skyDay='linear-gradient(180deg,#3E6E9E,#6E97B8 34%,#C4BC9E 62%,#EED7A2 80%,#F3E4C0)';
const skyNight='linear-gradient(180deg,#0A0F22,#1A2240 46%,#372F4C 76%,#4E3B47)';
const tabs=(on,t)=>`<div class="tabs">${[["home","నేడు"],["flower","నిత్య"],["book","సంకలనం"],["cal","పంచాంగం"]].map(([k,l],i)=>`<div class="tab${i===on?" on":""}">${I[k]}<span>${l}</span></div>`).join("")}</div>`;
function home(t){const n=t.night;
 return `<div class="bar"><span class="ic">${I.gear}</span><span class="wm">స్తుతి</span><span class="ic">${I.moon}</span></div>
 <div class="sky" style="background:${n?skyNight:skyDay}">${n?'<span class="moon"></span>':'<span class="sun"></span>'}<span class="greet">${n?"శుభ రాత్రి":"శుభ సాయంత్రం"}, Srikrishna</span><span class="loc">Bengaluru</span></div>
 <div class="card over"><div class="ey">సంధ్యావందనం</div><div class="srow"><b>సాయం సంధ్య</b><span>7:44 pm వరకు</span></div><div class="pbar"><span></span></div><div class="meta"><span>5:20 pm</span><span class="mid">ఉత్తమం 6:32 వరకు</span><span>7:44 pm</span></div></div>
 <div class="search">${I.srch} స్తోత్రాలు వెతకండి</div>
 <div class="shelfhead"><span class="ey">నిత్య పారాయణ</span><span class="more">అన్నీ</span></div>
 <div class="shelf"><div class="scard"><span class="dot" style="background:#C25A3A"></span><b>హనుమాన్ చాలీసా</b><small>Hanumān Cālīsā</small><span class="go">కొనసాగించండి</span></div><div class="scard"><span class="dot" style="background:#9A4E8E"></span><b>లలితా సహస్రనామం</b><small>Lalitā Sahasranāma</small><span class="go">ప్రారంభించండి</span></div></div>
 ${tabs(0)}`}
function lib(t){const D=[["గ","గణేశ","#B34A5E"],["దే","దేవి","#9A4E8E"],["శి","శివ","#67727E"],["వి","విష్ణు","#3F6FA8"],["సు","సుబ్రహ్మణ్య","#4E8A50"],["ల","లక్ష్మి","#B08428"]];
 return `<div class="bar"><span class="ic">${I.gear}</span><span class="wm">స్తుతి</span><span class="ic">${I.moon}</span></div>
 <div class="lt">సంకలనం</div>
 <div class="chips"><span class="chip on">దేవత</span><span class="chip">రకం</span><span class="chip">మాసం</span><span class="chip">వ్రతం</span><span class="chip">నోము</span></div>
 <div class="dgrid">${D.map(([g,n,c])=>`<div class="dcell"><span class="em" style="color:${c};background:color-mix(in oklab, ${c} 10%, var(--sf));box-shadow:inset 0 0 0 1.5px color-mix(in oklab, ${c} 35%, transparent)">${g}</span><b>${n}</b></div>`).join("")}</div>
 ${tabs(2)}`}
function reader(t){
 return `<div class="rtop"><span class="ic">${I.back}</span><div><b>హనుమత్ ధ్యానం</b><small>Hanumat Dhyānam · ౧/౧</small></div></div>
 <div class="verse"><span class="vn">౧</span><div class="deva">मनोजवं मारुततुल्यवेगं
जितेन्द्रियं बुद्धिमतां वरिष्ठम् ।
वातात्मजं वानरयूथमुख्यं
श्रीरामदूतं शरणं प्रपद्ये ॥</div><div class="telv">మనోజవం మారుతతుల్యవేగం
జితేంద్రియం బుద్ధిమతాం వరిష్ఠమ్ ।
వాతాత్మజం వానరయూథముఖ్యం
శ్రీరామదూతం శరణం ప్రపద్యే ॥</div><div class="mean">Swift as thought, mighty as the wind, master of the senses, foremost of the wise — Rāma's messenger, in him I take refuge.</div></div>
 <div class="audio"><span class="play">${I.play}</span><div class="pbar"><span></span></div><small>0:38 · 1×</small></div>`}
let out="";
const sec=(x,y,k,h,p)=>{out+=`<div class="sec" style="left:${x}px;top:${y}px"><div class="k">${k}</div><h2>${h}</h2><p>${p}</p></div>`};
const frame=(x,y,t,label,sub,inner)=>{out+=`<div class="cap" style="left:${x}px;top:${y-32}px"><span class="sw" style="background:${t.acc}"></span>${label}${sub?` <small>${sub}</small>`:""}</div><div class="ph" style="left:${x}px;top:${y}px;${vars(t)}">${inner}</div>`};
// ---------- Section A ----------
sec(40,40,"Exploration · instead of the browns","A · Vasanta, all year",
"The whole app moves onto spring's palette — rose-madder accent where the gold is today, blossom-tinted parchment for the ground, a rose-black ink. The current app is first, for comparison. The sky band stays the real sky: it reports the hour, not the theme. What this costs: the gold chrome is the app's one ceremonial constant, and it goes away everywhere at once.");
let y=340;
frame(40,y,T.current,"Current","parchment & gold",home(T.current));
frame(490,y,T.vasanta,"Vasanta — home","rose madder",home(T.vasanta));
frame(940,y,T.vasanta,"Vasanta — library","",lib(T.vasanta));
frame(1390,y,T.vasanta,"Vasanta — reader","legibility check",reader(T.vasanta));
frame(1840,y,T.vasantaN,"Vasanta — night","rose lifted onto the dark ground",home(T.vasantaN));
// ---------- Section B ----------
sec(40,1250,"The theme follows the pañcāṅga","B · A theme for every ṛtu",
"The app already knows the season — the pañcāṅga engine computes it, and the weather motifs already carry its pigment. Here the whole ground follows: six palettes from the six ṛtu dyestuffs, and the app quietly changes clothes six times a year. Śarad is nearly the palette you have today — so the browns don't die, they become autumn's costume. Each hue keeps the pigment treatment the season tokens already got: indigo, madder, ochre, ash — never screen colour.");
y=1560;
const B=[["sisira","Śiśira · శిశిర","late winter — frost"],["vasanta","Vasanta · వసంత","spring — rose madder"],["grisma","Grīṣma · గ్రీష్మ","summer — turmeric"],["varsa","Varṣā · వర్ష","monsoon — indigo"],["sarad","Śarad · శరద్","autumn — ochre, ≈ today"],["hemanta","Hemanta · హేమంత","early winter — ash"]];
B.forEach(([k,l,s],i)=>frame(40+i*450,y,T[k],l,s,home(T[k])));
// ---------- Section C ----------
sec(40,2470,"The middle path","C · Parchment bones, seasonal light",
"The room stays the same; the light in it changes. Ink, cards and type keep today's parchment ramp — only the ground takes a wash of the season's pigment (about 13%), and the gold accent yields to the season's dyestuff. This is the least risky read of your instinct: the app stays recognisably Stuti in every month, but a screenshot from Vasanta and one from Varṣā are unmistakably different weather. It also matches what the app already does — the sky and the falling motifs change; this lets the ground agree with them.");
y=2780;
frame(40,y,TC.vasanta,"Vasanta wash","13% rose on parchment",home(TC.vasanta));
frame(490,y,TC.varsa,"Varṣā wash","13% indigo on parchment",home(TC.varsa));
frame(940,y,TC.grisma,"Grīṣma wash","13% turmeric on parchment",home(TC.grisma));
frame(1390,y,TC.vasanta,"Vasanta wash — library","",lib(TC.vasanta));
document.body.innerHTML=out;
</script>
</body>
</html>
