<!DOCTYPE html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<title>Transition months — mild dual-season mix</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Mukta:wght@300;400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--font-display:'Marcellus',Georgia,serif;--font-ui:'Mukta',system-ui,sans-serif;--font-deva:'Noto Sans Devanagari','Mukta',sans-serif;--ease:cubic-bezier(.4,0,.2,1)}
[data-theme="day"]{--bg:#F7EFE2;--bg-warm:#F2E6D2;--surface:#FFFDF8;--surface-2:#FBF4E8;--ink:#2B2017;--ink-soft:#584B3E;--ink-faint:#6F6356;--line:rgba(43,32,23,0.10);--gold:#B07A2B;--gold-deep:#8A5A18;--rtu-sisira:#9FB2C4;--rtu-vasanta:#D08A9C;--rtu-grisma:#D8932F;--rtu-varsa:#46648C;--rtu-sarad:#C08A38;--rtu-hemanta:#A79C8C;--leaf-green-1:#7C8A4E;--leaf-green-2:#94A05C;--leaf-gold-1:#C89A3C;--leaf-gold-2:#DCB255;--leaf-brown-1:#9A6A32;--leaf-brown-2:#7C5228;--bloom-pink-1:#D08A9C;--bloom-pink-2:#C0708A;--bloom-yellow-1:#E0BE55;--bloom-yellow-2:#EBD07C;--bloom-orange-1:#DE9552;--bloom-orange-2:#C77739;--bloom-violet-1:#9C7CC2;--bloom-violet-2:#7E5EA6}
[data-theme="night"]{--bg:#14110C;--bg-warm:#1A150E;--surface:#211B13;--surface-2:#271F16;--ink:#F4EAD7;--ink-soft:#C2B197;--ink-faint:#9C8B72;--line:rgba(244,234,215,0.13);--gold:#E2B266;--gold-deep:#E7C079;--rtu-sisira:#A9BACA;--rtu-vasanta:#D2909F;--rtu-grisma:#E0A047;--rtu-varsa:#6E8CB4;--rtu-sarad:#CE9A47;--rtu-hemanta:#B2A797;--leaf-green-1:#8D9B5D;--leaf-green-2:#A3B06B;--leaf-gold-1:#D6A84A;--leaf-gold-2:#E6C06A;--leaf-brown-1:#AE7B3E;--leaf-brown-2:#916234;--bloom-pink-1:#D2909F;--bloom-pink-2:#C67C94;--bloom-yellow-1:#E8CA69;--bloom-yellow-2:#F0D98D;--bloom-orange-1:#E7A263;--bloom-orange-2:#D3894B;--bloom-violet-1:#AC8ED2;--bloom-violet-2:#9375BC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-weight:300;-webkit-font-smoothing:antialiased}
a{color:var(--gold-deep)}a:hover{color:var(--gold)}
.wrap{max-width:1180px;margin:0 auto;padding:44px 32px 90px}
header{display:flex;flex-direction:column;gap:14px;padding-bottom:26px;border-bottom:1px solid var(--line)}
h1{font-family:var(--font-display);font-weight:400;font-size:34px;margin:0}
.lede{margin:0;max-width:68ch;color:var(--ink-soft);font-size:15.5px;line-height:1.65;text-wrap:pretty}
.tgl{display:flex;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;width:max-content}
.tgl button{font:inherit;font-size:13px;padding:6px 15px;border:0;border-radius:999px;background:transparent;color:var(--ink-faint);cursor:pointer}
.tgl button.on{background:color-mix(in oklab,var(--gold) 13%,var(--surface));color:var(--gold-deep);box-shadow:inset 0 0 0 1.5px color-mix(in oklab,var(--gold) 40%,transparent)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
.cell{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,var(--bg-warm),var(--bg) 42%);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.wash{position:absolute;inset:0;z-index:0;background:linear-gradient(180deg,color-mix(in oklab,var(--rtu) 26%,transparent),transparent 60%)}
.pcard-ambient{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.pcard-ambient span,.bough-petal{animation-fill-mode:backwards}
.pcard-ambient.shimmer{background:none}
.pcard-ambient.shimmer .sun-arc{position:absolute;top:11%;left:-18%;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle,color-mix(in oklab,var(--rtu) 84%,#FFF4D2) 0 26%,var(--rtu) 44%,color-mix(in oklab,var(--rtu) 80%,var(--gold-deep)) 58%,color-mix(in oklab,var(--rtu) 40%,transparent) 70%,color-mix(in oklab,var(--rtu) 14%,transparent) 84%,transparent 94%);animation:pcSunArc 52s linear infinite}
.pcard-ambient.mist .mist-dew{position:absolute;left:auto;width:8px;height:10px;top:auto;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:radial-gradient(60% 55% at 38% 32%,color-mix(in oklab,var(--surface) 85%,transparent) 0 30%,color-mix(in oklab,var(--rtu) 46%,var(--surface)) 55%,color-mix(in oklab,var(--rtu) 72%,transparent) 100%);box-shadow:0 1px 2px color-mix(in oklab,var(--ink) 10%,transparent);animation:pcDew 7s ease-in infinite}
.pcard-ambient.mist .mist-dew::after{content:"";position:absolute;top:22%;left:30%;width:2px;height:2px;border-radius:50%;background:color-mix(in oklab,#FFF9E8 88%,var(--rtu));box-shadow:0 0 3px 1px color-mix(in oklab,#FFF9E8 60%,transparent);animation:pcDewSpark 2.6s ease-in-out infinite}
@keyframes pcDew{0%{transform:translateY(0) scale(calc(var(--dsc,1)*.55));opacity:0}14%{transform:translateY(0) scale(var(--dsc,1));opacity:.85}52%{transform:translateY(2px) scale(var(--dsc,1));opacity:1}84%{transform:translateY(16px) scale(calc(var(--dsc,1)*.82));opacity:.5}100%{transform:translateY(26px) scale(calc(var(--dsc,1)*.6));opacity:0}}
@keyframes pcDewSpark{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes pcSunArc{0%{left:-18%;transform:scale(.8);filter:brightness(.88) saturate(.9);box-shadow:0 0 10px 2px color-mix(in oklab,var(--rtu) 16%,transparent)}50%{left:44%;transform:scale(1.2);filter:brightness(1.22) saturate(1.1);box-shadow:0 0 72px 30px color-mix(in oklab,var(--rtu) 62%,transparent)}100%{left:106%;transform:scale(.8);filter:brightness(.88) saturate(.9);box-shadow:0 0 10px 2px color-mix(in oklab,var(--rtu) 16%,transparent)}}
.pcard-ambient.mist .mist-band{position:absolute;left:-70%;width:88%;border-radius:999px;background:radial-gradient(62% 100% at 50% 55%,color-mix(in oklab,var(--rtu) 62%,var(--surface)) 0 38%,color-mix(in oklab,var(--rtu) 34%,transparent) 68%,transparent 90%);filter:blur(7px);animation-name:pcFogPass;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes pcFogPass{0%{transform:translateX(0);opacity:0}12%{opacity:.7}50%{opacity:.92}88%{opacity:.6}100%{transform:translateX(210%);opacity:0}}
.pcard-ambient.mist .mist-sun{position:absolute;top:14%;right:14%;width:48px;height:48px;border-radius:50%;left:auto;background:radial-gradient(circle at 44% 40%,color-mix(in oklab,var(--gold) 58%,#FFD06B) 0 30%,color-mix(in oklab,var(--gold) 90%,#FFC456) 58%,var(--gold) 86%,color-mix(in oklab,var(--gold) 88%,var(--gold-deep)) 100%);box-shadow:0 0 20px 8px color-mix(in oklab,var(--gold) 22%,transparent);animation:pcVeil 26s linear infinite}
@keyframes pcVeil{0%,26%{opacity:1;filter:blur(0) saturate(1)}44%,58%{opacity:.5;filter:blur(3px) saturate(.72)}76%,100%{opacity:1;filter:blur(0) saturate(1)}}
.pcard-ambient.mist .mist-pool{position:absolute;left:-6%;right:-6%;bottom:-4%;top:auto;width:auto;height:42%;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--rtu) 13%,transparent) 70%);animation:pcPool 11s var(--ease) infinite alternate}
@keyframes pcPool{from{opacity:.55;transform:translateY(4%)}to{opacity:.95;transform:translateY(0)}}
.bough-petal{position:absolute;top:10%;width:22px;height:22px;animation-name:pcPetal;animation-timing-function:linear;animation-iteration-count:infinite}
.bough-petal::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--pet,var(--rtu)) 45%,var(--bg)) 0 18%,transparent 19%),radial-gradient(circle at 50% 14%,color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent) 0 17%,transparent 18%),radial-gradient(circle at 84% 40%,color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent) 0 17%,transparent 18%),radial-gradient(circle at 71% 83%,color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent) 0 17%,transparent 18%),radial-gradient(circle at 29% 83%,color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent) 0 17%,transparent 18%),radial-gradient(circle at 16% 40%,color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent) 0 17%,transparent 18%)}
.bough-petal{--p8:color-mix(in oklab,var(--pet,var(--rtu)) 92%,transparent)}
.bough-petal.f-rosette::before{background:radial-gradient(circle at 50% 50%,color-mix(in oklab,var(--pet,var(--rtu)) 40%,var(--bg)) 0 15%,transparent 16%),radial-gradient(circle at 50% 22%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 70% 30%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 78% 50%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 70% 70%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 50% 78%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 30% 70%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 22% 50%,var(--p8) 0 14%,transparent 15%),radial-gradient(circle at 30% 30%,var(--p8) 0 14%,transparent 15%)}
.bough-leaf{position:absolute;top:10%;width:11px;height:8px;border-radius:0 70% 0 70%;background:var(--leaf,var(--leaf-green-2));animation-name:pcPetal;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:backwards}
@keyframes pcPetal{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.92}80%{opacity:.82}100%{transform:translate(26px,230px) rotate(240deg);opacity:0}}
.pcard-ambient.frost span{position:absolute;top:-6%;width:2.5px;height:2.5px;border-radius:50%;background:color-mix(in oklab,var(--rtu) 72%,var(--rtu-varsa));animation-name:pcFrost;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes pcFrost{0%{transform:translate(0,-10px);opacity:0}16%{opacity:.75}74%{opacity:.62}100%{transform:translate(12px,260px);opacity:0}}
.pcard-ambient.frost .frost-flake{position:absolute;top:-8%;width:22px;height:22px;border-radius:0;background:none;--flk:color-mix(in oklab,var(--rtu) 58%,var(--rtu-varsa));filter:drop-shadow(0 0 2px color-mix(in oklab,var(--rtu) 34%,transparent));animation-name:pcFlake;animation-timing-function:linear;animation-iteration-count:infinite}
.frost-flake svg{display:block;width:100%;height:100%;overflow:visible}
.flake-arm{stroke:var(--flk);fill:none;stroke-linecap:round}
.flake-core{fill:color-mix(in oklab,#FFFFFF 55%,var(--flk))}
.flake-spark{transform-origin:12px 12px;filter:drop-shadow(0 0 2.5px color-mix(in oklab,#FFFFFF 70%,var(--flk)));animation:pcTwinkle 2s ease-in-out infinite}
.flake-spark line{stroke:color-mix(in oklab,#FFFFFF 82%,var(--flk));stroke-width:1.5;stroke-linecap:round}
@keyframes pcTwinkle{0%,100%{opacity:.2;transform:scale(.5)}46%{opacity:1;transform:scale(1.35)}58%{opacity:.95;transform:scale(1.2)}}
@keyframes pcFlake{0%{transform:translate(0,-18px) rotate(0);opacity:0}12%{opacity:.95}76%{opacity:.85}100%{transform:translate(-16px,270px) rotate(200deg);opacity:0}}
.pcard-ambient.dawn .dawn-mist{position:absolute;left:-60%;bottom:0%;width:80%;height:34%;border-radius:999px;background:radial-gradient(60% 100% at 50% 70%,color-mix(in oklab,var(--rtu) 46%,var(--surface)) 0 40%,color-mix(in oklab,var(--rtu) 22%,transparent) 70%,transparent 92%);filter:blur(9px);animation-name:pcDawnDrift;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes pcDawnDrift{0%{transform:translateX(0) translateY(0);opacity:0}18%{opacity:.55}50%{transform:translateX(70%) translateY(-3%);opacity:.7}82%{opacity:.4}100%{transform:translateX(150%) translateY(-1%);opacity:0}}
.pcard-ambient.dawn .dawn-dew{position:absolute;bottom:6%;width:6px;height:6px;border-radius:50%;background:radial-gradient(circle at 36% 32%,color-mix(in oklab,#FFFDF6 70%,var(--rtu)) 0 22%,color-mix(in oklab,var(--rtu) 60%,#FFFDF6) 55%,color-mix(in oklab,var(--rtu) 80%,transparent) 100%);filter:blur(var(--dblur,0.3px));animation-name:pcDawnDew;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes pcDawnDew{0%,100%{opacity:0;transform:scale(.7)}10%{opacity:.75}45%{opacity:.9;transform:scale(1)}55%{opacity:.85}90%{opacity:.4}}
.pcard-ambient.dawn .dawn-ember{position:absolute;bottom:2%;width:3px;height:3px;border-radius:50%;background:radial-gradient(circle,#FFDDA6 0 30%,#F0A94E 60%,transparent 100%);filter:blur(0.4px);box-shadow:0 0 4px 1px rgba(240,169,78,0.45);animation-name:pcEmberRise;animation-timing-function:ease-out;animation-iteration-count:infinite}
@keyframes pcEmberRise{0%{transform:translate(0,0) scale(.6);opacity:0}10%{opacity:.85}45%{transform:translate(var(--ex1,6px),-58%) scale(1);opacity:.9}80%{transform:translate(var(--ex2,-4px),-88%) scale(.7);opacity:.35}100%{transform:translate(var(--ex2,-4px),-100%) scale(.4);opacity:0}}
.pcard-ambient.rain .rain-cloud{position:absolute;left:-45%;border-radius:999px;top:4%;width:40%;height:16%;opacity:1;background:radial-gradient(60% 100% at 50% 65%,color-mix(in oklab,var(--rtu) 62%,transparent),color-mix(in oklab,var(--rtu) 30%,transparent) 62%,transparent 88%);filter:blur(2px);animation-name:pcCloud;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes pcCloud{0%{transform:translateX(0)}100%{transform:translateX(360%)}}
.pcard-ambient.rain span{position:absolute;top:-14%;width:1.4px;height:16px;border-radius:1px;background:linear-gradient(180deg,transparent,color-mix(in oklab,var(--rtu) 70%,transparent));animation-name:pcRain;animation-timing-function:linear;animation-iteration-count:infinite;opacity:.55}
@keyframes pcRain{0%{transform:translateY(-20px);opacity:0}12%{opacity:.6}100%{transform:translateY(260px);opacity:0}}
.pcard-ambient.leaves span{position:absolute;top:-10%;width:15px;height:11px;border-radius:0 70% 0 70%;background:var(--leaf,var(--rtu));animation-name:pcFall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes pcFall{0%{transform:translateY(-14px) rotate(0);opacity:0}12%{opacity:.92}82%{opacity:.82}100%{transform:translateY(270px) rotate(220deg);opacity:0}}
.glyph{position:absolute;top:14px;right:15px;z-index:2;color:var(--rtu)}
.cap{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px}
.cap b{font-family:var(--font-display);font-weight:400;font-size:18px}
.cap .dev{font-family:var(--font-deva);font-size:13px;color:var(--ink-soft)}
.cap .mot{font-size:12.5px;color:var(--ink-faint);margin-top:3px}
.notes{margin-top:46px;padding:24px 26px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.notes h3{font-family:var(--font-display);font-weight:400;font-size:19px;margin:0 0 10px}
.notes p{margin:0 0 12px;color:var(--ink-soft);font-size:15px;line-height:1.7;max-width:74ch;text-wrap:pretty}
.notes p:last-child{margin-bottom:0}
.notes strong{font-weight:500;color:var(--ink)}
@media (max-width:820px){.grid{grid-template-columns:1fr}.wrap{padding:28px 18px 60px}}
</style>

<style>
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:30px}
.cell{position:relative;overflow:hidden;border-radius:14px;border:1px solid var(--line);min-height:230px;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.mixlayer{position:absolute;inset:0;opacity:.62}
.glyph{position:absolute;top:14px;right:15px;z-index:2;color:var(--rtu)}
.cap{position:relative;z-index:2;display:flex;flex-direction:column;gap:2px}
.cap b{font-family:var(--font-display);font-weight:400;font-size:18px}

<body>
<div class="wrap">
<header>
<h1>Transition months — a mild mix, not a hard cut</h1>
<p class="lede">Each masa below sits at a ṛtu boundary. Instead of snapping straight from one motif to the next, it carries a muted version of both at once, and its background blends both hues.</p>
</header>
<div class="grid" id="g"></div>
</div>
<script>
function sun(rays,r){let g=`<circle cx="16" cy="16" r="${r}" fill="currentColor"/>`;for(let i=0;i<8;i++){const a=i*Math.PI/4;g+=`<line x1="${16+Math.cos(a)*(r+2)}" y1="${16+Math.sin(a)*(r+2)}" x2="${16+Math.cos(a)*(r+2+rays)}" y2="${16+Math.sin(a)*(r+2+rays)}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>`}return g}
const CLOUD='<path d="M8 21 q-3 0 -3 -3 q0 -3 3 -3 q0.4 -4 4.5 -4 q3.7 0 4.4 3.4 q0.6 -0.4 1.6 -0.4 q2.5 0 2.5 2.5 q2 0.2 2 2.3 q0 2.6 -2.8 2.6 Z" fill="currentColor"/>';
function glyph(kind){let inner="";
 if(kind==="sun-hot")inner=sun(6,6.5);else if(kind==="sun-cold")inner=sun(3,6);
 else if(kind==="dawn")inner='<g stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"><path d="M6 13 q5 -2.5 10 0 t10 0" opacity="0.5"/><path d="M6 18 q5 -2.5 10 0 t10 0" opacity="0.8"/><circle cx="22" cy="9" r="1.6" fill="currentColor" opacity="0.9"/><circle cx="9" cy="9" r="1" fill="currentColor" opacity="0.6"/></g>';
 else if(kind==="blossom"){inner='<g fill="currentColor">';for(let i=0;i<5;i++){const a=i*2*Math.PI/5-Math.PI/2,x=16+Math.cos(a)*6.4,y=16+Math.sin(a)*6.4;inner+=`<ellipse cx="${x}" cy="${y}" rx="3.4" ry="5.2" transform="rotate(${a*180/Math.PI+90} ${x} ${y})" opacity="0.9"/>`}inner+='<circle cx="16" cy="16" r="2.6"/></g>'}
 else if(kind==="rain"){inner="<g>"+CLOUD;[10,15.5,21].forEach(x=>{inner+=`<line x1="${x}" y1="23" x2="${x-1.6}" y2="28" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>`});inner+="</g>"}
 else if(kind==="leaf")inner='<g fill="currentColor"><path d="M23 7 C13 8 8 14 8 22 C8 24 9 25 11 25 C20 25 25 17 25 9 C25 8 24 7 23 7 Z" opacity="0.92"/><path d="M20 11 L11.5 22.5" stroke="var(--surface)" stroke-width="1.4" fill="none" stroke-linecap="round"/></g>';
 else if(kind==="mist")inner='<g stroke="currentColor" stroke-width="2.1" stroke-linecap="round" fill="none"><path d="M6 11 q5 -2.5 10 0 t10 0" opacity="0.45"/><path d="M6 16 q5 -2.5 10 0 t10 0" opacity="0.75"/><path d="M6 21 q5 -2.5 10 0 t10 0" opacity="0.55"/></g>';
 return `<svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">${inner}</svg>`}
function ambient(kind){

 if(kind==="blossom"){const BS=["var(--bloom-pink-1)","var(--bloom-yellow-1)","var(--bloom-violet-1)","var(--bloom-orange-1)","var(--bloom-pink-2)","var(--bloom-violet-2)","var(--bloom-yellow-2)","var(--bloom-orange-2)"],BF=["f-bloom","f-rosette"],BZ={"f-bloom":[17,14,19],"f-rosette":[16,13,18]};let s="";for(let i=0;i<9;i++){const fm=BF[i%BF.length],sz=BZ[fm][i%3];s+=`<span class="bough-petal ${fm}" style="left:${(i*11+4)%94}%;animation-delay:${i*1.3}s;animation-duration:${7+(i%4)*1.4}s;width:${sz}px;height:${sz}px;--pet:${BS[i%BS.length]}"></span>`}for(let i=0;i<2;i++)s+=`<span class="bough-leaf" style="left:${18+i*34}%;animation-delay:${4+i*6}s;animation-duration:${8+i*1.5}s;--leaf:${i%2?"var(--leaf-green-1)":"var(--leaf-green-2)"}"></span>`;;return `<div class="pcard-ambient bough">${s}</div>`}

function thin(html){
  return html.replace(/<div class="pcard-ambient ([^"]*)">([\s\S]*)<\/div>/,(full,cls,inner)=>{
    const spans=inner.match(/<span[\s\S]*?<\/span>|<span[^>]*\/>/g)||[];
    if(!spans.length)return `<div class="pcard-ambient ${cls}"></div>`;
    const keep=Math.max(1,Math.ceil(spans.length*0.18));
    const step=spans.length/keep;
    const picked=[];
    for(let i=0;i<keep;i++)picked.push(spans[Math.floor(i*step)]);
    return `<div class="pcard-ambient ${cls}">${picked.join("")}</div>`;
  });
}
