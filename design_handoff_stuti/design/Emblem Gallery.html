<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Emblems — the set you gave</title>
<style>
body{margin:0;background:#f4ecdd;font-family:Georgia,serif;color:#3a2f22;padding:40px}
h1{font-size:22px;font-weight:600;margin:0 0 6px}
p.sub{margin:0 0 28px;font-size:14px;opacity:.7}
a{color:#7a4a1f}a:hover{color:#5a3512}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:18px}
.card{background:#fbf6ea;border:1px solid #e0d5bd;border-radius:10px;padding:18px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.cell span{font-size:11px;opacity:.6}
.sw{width:72px;height:72px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.sw img{width:60px;height:60px;object-fit:contain}
.day{background:#fbf6ea;border:1px solid #e6dcc4}
.night{background:#1d1a14}
</style></head><body>
<h1>Deity emblems</h1>
<p class="sub">The drawn face marks in <b>emblems/</b> — each in its day, night, ink-day and ink-night tints, plus the untinted source.</p>
<div class="grid" id="g"></div>
<script>
const names=["ganesha","shiva","devi","vishnu","subrahmanya","surya","guru","hanuman"];
const variants=[["","Source","day"],["-day","Day","day"],["-inkday","Ink day","day"],["-night","Night","night"],["-inknight","Ink night","night"]];
document.getElementById('g').innerHTML=names.map(n=>'<div class="card"><h2>'+n.charAt(0).toUpperCase()+n.slice(1)+'</h2><div class="row">'+variants.map(v=>'<div class="cell"><div class="sw '+v[2]+'"><img src="emblems/'+n+'-face'+v[0]+'.png" alt=""></div><span>'+v[1]+'</span></div>').join('')+'</div></div>').join('')
+'<div class="card"><h2>Shiva mark (extra)</h2><div class="row">'+[["","Source","day"],["-ash","Ash","night"],["-white","White","night"]].map(v=>'<div class="cell"><div class="sw '+v[2]+'"><img src="emblems/shiva-mark'+v[0]+'.png" alt=""></div><span>'+v[1]+'</span></div>').join('')+'</div></div>';
</script>
</body></html>
