<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Akshara · Mobile preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Spectral:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #2A2014;
    background-image: radial-gradient(circle at 20% 0%, rgba(192,116,20,0.16), transparent 45%),
                      radial-gradient(circle at 85% 100%, rgba(110,30,24,0.18), transparent 45%);
    color: #F0E4CC; font-family: "Spectral", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 40px 20px 64px; box-sizing: border-box; min-height: 100%;
  }
  .head { text-align: center; max-width: 560px; margin-bottom: 30px; }
  .eyebrow { font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: #D29A3A; font-weight: 500; }
  h1 { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: 38px; margin: 10px 0 8px; }
  .head p { color: #BBA888; font-size: 15.5px; line-height: 1.6; margin: 0; }
  .stage { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .device-cap { text-align: center; margin-top: 16px; color: #BBA888; font-size: 13.5px; letter-spacing: 0.02em; }
  .device-cap b { color: #F0E4CC; font-weight: 600; font-family: "Cormorant Garamond", serif; font-size: 16px; }
  #root { display: flex; justify-content: center; }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; }
  .app-screen { width: 100%; height: 100%; box-sizing: border-box; padding: 56px 0 30px; }
  .app-screen iframe { width: 100%; height: 100%; border: 0; display: block; background: #F3E9D6; }
</style>
</head>
<body>
  <div class="head">
    <div class="eyebrow">Responsive · mobile-first</div>
    <h1>Akshara on a phone</h1>
    <p>The live app, running at phone width — tap through it. Bottom tab bar for the main sections, a “More” sheet for the rest, and the new snap-slider speed control in the reciter.</p>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="stuti-boot.js"></script>
<script>StutiBoot.load([
  "ios-frame.jsx"
]);</script>
<script type="text/babel">
    function MobilePreview() {
      return (
        <div className="stage">
          <div className="frame-wrap">
            <IOSDevice width={390} height={812}>
              <div className="app-screen">
                <iframe src="Akshara.html" title="Akshara live (mobile)"></iframe>
              </div>
            </IOSDevice>
            <div className="device-cap"><b>Live app</b> · iPhone width (390px)</div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<MobilePreview />);
  </script>
</body>
</html>
