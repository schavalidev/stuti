<style>
  #root { min-height: 100vh; }
  @keyframes spin360 { to { transform: rotate(360deg); } }
  .mandala-spin { animation: spin360 120s linear infinite; transform-origin: center; }
  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  .pulse { animation: pulseDot 1.4s ease-in-out infinite; }
  .coll-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--gold) !important; }
  .hub-tile:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--gold) !important; }
  .text-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lift); border-color: var(--gold) !important; }
  .text-card-list:hover { border-color: var(--gold) !important; box-shadow: var(--shadow-soft); }
  input::placeholder { color: var(--ink-faint); }
  select { cursor: pointer; }
</style>
