<!DOCTYPE html>
<html lang="en" data-theme="day" data-palette="unified">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stuti · Telugu reader font comparison</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="stuti.css" />
<link rel="stylesheet" href="stuti-components.css" />
<link rel="stylesheet" href="stuti-palette.css" />
<style>
@font-face{font-family:'CmpRamaneeya';src:url('uploads/RamaneeyaWin.ttf') format('truetype');font-display:swap;}
@font-face{font-family:'CmpTenali';src:url('uploads/TenaliRamakrishna-Regular.ttf') format('truetype');font-display:swap;}
@font-face{font-family:'CmpKanakaDurga';src:url('uploads/KanakaDurga-864eb569.otf') format('opentype');font-display:swap;}
@font-face{font-family:'CmpKanakaDurgaAlt';src:url('uploads/KanakaDurga-Italic-a4a14a4d.otf') format('opentype');font-display:swap;}

*{box-sizing:border-box}
body{margin:0;background:#EDE3CF;font-family:var(--font-ui);padding:36px 24px 60px}
.pg-head{max-width:1400px;margin:0 auto 28px}
.pg-eyebrow{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--gold-deep)}
.pg-title{font-family:var(--font-display);font-size:30px;margin:8px 0 6px;color:var(--ink)}
.pg-lede{color:var(--ink-soft);font-size:15.5px;max-width:74ch}

.cols{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.col{display:flex;flex-direction:column;gap:10px}
.col-label{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 4px}
.col-name{font-family:var(--font-display);font-size:17px;color:var(--ink)}
.col-file{font-size:11.5px;color:var(--ink-faint)}

.phone{width:100%;aspect-ratio:9/17.5;border-radius:34px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(58,40,20,.45),0 0 0 1px rgba(58,40,20,.08);background:var(--bg);position:relative;display:flex;flex-direction:column}
.phone .view.reader{height:100%;display:flex;flex-direction:column}
.phone .reader-scroll{overflow:hidden}
.phone .reader-topbar-name{font-size:1.5rem}
</style>
</head>
<body>

<div class="pg-head">
  <div class="pg-eyebrow">Verse font · Telugu candidates</div>
  <h1 class="pg-title">The reader screen, side by side</h1>
  <p class="pg-lede">Same hymn opening, same chrome — header, script/view pills and the verse itself — set in each of the four candidate faces so they can be judged at true reading scale rather than as loose specimens.</p>
</div>

<div class="cols" id="cols"></div>

<script src="stuti-translit.js"></script>
<script>
var VERSE_DEVA = ["वक्रतुण्ड महाकाय सूर्यकोटिसमप्रभ।", "निर्विघ्नं कुरु मे देव सर्वकार्येषु सर्वदा॥"];
var TITLE_DEVA = "श्रीगणेशपञ्चरत्नम्";
function toTel(s){ return window.STUTI_TRANSLIT.convert(s, "telugu"); }

var CANDIDATES = [
  { label: "RamaneeyaWin", file: "RamaneeyaWin.ttf", fam: "'CmpRamaneeya'" },
  { label: "Tenali Ramakrishna", file: "TenaliRamakrishna-Regular.ttf", fam: "'CmpTenali'" },
  { label: "Kanaka Durga", file: "KanakaDurga.otf", fam: "'CmpKanakaDurga'" },
  { label: "Kanaka Durga · Italic cut", file: "KanakaDurga-Italic.otf", fam: "'CmpKanakaDurgaAlt'" }
];

var titleTel = toTel(TITLE_DEVA);
var l1 = toTel(VERSE_DEVA[0]), l2 = toTel(VERSE_DEVA[1]);

var BACK_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>';

var cols = document.getElementById("cols");
CANDIDATES.forEach(function (c) {
  var col = document.createElement("div");
  col.className = "col";
  col.innerHTML =
    '<div class="col-label"><span class="col-name">' + c.label + '</span><span class="col-file">' + c.file + '</span></div>' +
    '<div class="phone">' +
      '<div class="view reader" style="flex:1">' +
        '<div class="topbar reader-topbar">' +
          '<button class="icon-btn" tabindex="-1">' + BACK_SVG + '</button>' +
          '<div class="reader-topbar-title"><div class="reader-topbar-name display" style="font-family:' + c.fam + '">' + titleTel + '</div></div>' +
          '<span class="rd-topbar-pad" aria-hidden="true"></span>' +
        '</div>' +
        '<div class="reader-layers tight">' +
          '<div class="rd-view" role="tablist">' +
            '<button class="rd-view-btn on"><span>Verse</span></button>' +
            '<button class="rd-view-btn"><span>Full text</span></button>' +
          '</div>' +
          '<button class="chip">Meaning</button>' +
          '<button class="chip chip-learn">Learn</button>' +
        '</div>' +
        '<div class="reader-scroll scroll" style="flex:1">' +
          '<div class="reader-verse-stage">' +
            '<div class="verse verse-active">' +
              '<div class="verse-body"><div class="verse-lines">' +
                '<div class="line line-on"><div class="line-telugu" style="font-family:' + c.fam + ", var(--font-telugu)" + '">' + l1 + '</div></div>' +
                '<div class="line"><div class="line-telugu" style="font-family:' + c.fam + ", var(--font-telugu)" + '">' + l2 + '</div></div>' +
              '</div></div>' +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  cols.appendChild(col);
});
</script>
</body>
</html>
