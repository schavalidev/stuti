<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stuti — corpus audit</title>
<style>
  :root{
    --bg:#fbf8f3; --panel:#fff; --line:#e3dcd0; --ink:#23201c; --dim:#6d675e;
    --accent:#8a3b12; --warn:#9a6b00; --warnbg:#fdf3d8; --sel:#f1e8da;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#17150f; --panel:#1f1c16; --line:#332e25; --ink:#ece6da; --dim:#9d968a;
           --accent:#e0a070; --warn:#d9b25e; --warnbg:#2b2415; --sel:#2a251c; }
  }
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);display:flex;height:100vh;overflow:hidden}
  /* sidebar */
  #side{width:300px;flex:0 0 300px;border-right:1px solid var(--line);display:flex;
        flex-direction:column;background:var(--panel)}
  #side h1{margin:0;padding:12px 14px 8px;font-size:13px;letter-spacing:.08em;
           text-transform:uppercase;color:var(--dim);font-weight:600}
  #q{margin:0 10px 8px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;
     background:var(--bg);color:var(--ink);font:inherit}
  #sidebarfoot{padding:6px 12px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
  #list{flex:1;overflow:auto;padding:0 0 10px}
  .fold{padding:7px 12px 3px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
        color:var(--dim);font-weight:700;position:sticky;top:0;background:var(--panel)}
  .row{padding:5px 12px;cursor:pointer;display:flex;gap:6px;align-items:baseline;border-left:3px solid transparent}
  .row:hover{background:var(--sel)}
  .row.on{background:var(--sel);border-left-color:var(--accent)}
  .row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .n{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .badge{font-size:10px;padding:0 5px;border-radius:8px;background:var(--warnbg);color:var(--warn);font-weight:700}
  .badge.hard{background:#f6ddd2;color:#9c3a10}
  @media (prefers-color-scheme: dark){ .badge.hard{background:#3a2317;color:#e6a17c} }
  #bar select{font:inherit;font-size:12px;background:var(--bg);color:var(--ink);
              border:1px solid var(--line);border-radius:5px;padding:2px 4px}
  /* main */
  #main{flex:1;overflow:auto;padding:0 0 60vh}
  #bar{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
       padding:10px 22px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  #bar label{font-size:12px;color:var(--dim);display:flex;gap:4px;align-items:center;cursor:pointer}
  #bar .grp{display:flex;gap:11px;padding-right:14px;border-right:1px solid var(--line)}
  #bar .grp:last-of-type{border:0}
  .wrap{max-width:1180px;margin:0 auto;padding:22px}
  h2{margin:0 0 2px;font-size:24px;font-weight:600}
  .sub{color:var(--dim);font-size:15px;margin-bottom:2px}
  .meta{color:var(--dim);font-size:12px;margin:10px 0 0}
  .blurb{margin:14px 0 0;max-width:76ch}
  details.app{margin:16px 0 0;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
  details.app>summary{padding:8px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--dim);
                      text-transform:uppercase;letter-spacing:.06em}
  .appbody{padding:0 14px 12px;font-size:13px}
  .appbody .f{margin:10px 0 0}
  .appbody .f b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--dim)}
  .appbody .f div{white-space:pre-wrap;word-break:break-word}
  .flags{margin:14px 0 0;border-left:3px solid var(--warn);background:var(--warnbg);padding:8px 12px;
         border-radius:0 6px 6px 0;font-size:13px}
  .flags b{display:block;margin-bottom:4px}
  .flags li{margin:1px 0}
  /* verses */
  .unit{border-top:1px solid var(--line);padding:18px 0 4px;scroll-margin-top:90px}
  .unit.on{background:var(--sel);box-shadow:-12px 0 0 var(--sel),12px 0 0 var(--sel)}
  .uh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
  .scripts{display:grid;gap:22px;grid-template-columns:repeat(var(--sc,2),minmax(0,1fr))}
  .mean{display:grid;gap:22px;margin-top:14px;grid-template-columns:repeat(var(--mc,3),minmax(0,1fr))}
  .cell .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
  .deva{font-family:"Noto Serif Devanagari","Kohinoor Devanagari","Devanagari MT",serif;font-size:21px;line-height:1.95;white-space:pre-wrap}
  .telscript{font-family:"Noto Serif Telugu","Telugu MN","Kohinoor Telugu",serif;font-size:19px;line-height:1.9;white-space:pre-wrap}
  .iast{font-size:16px;line-height:1.85;white-space:pre-wrap;font-style:italic}
  .prose{white-space:pre-wrap;font-size:14px}
  .prose.telugu{font-family:"Noto Serif Telugu","Telugu MN","Kohinoor Telugu",serif;font-size:15px;line-height:1.8}
  .variant{margin-top:8px;font-size:13px;color:var(--dim);white-space:pre-wrap}
  .vidhi{margin-top:8px;white-space:pre-wrap;border-left:2px solid var(--line);padding-left:10px}
  .empty{color:var(--warn);font-size:12px}
  #hint{color:var(--dim);padding:60px 22px;max-width:62ch}
  kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:11px}
</style>

<div id="side">
  <h1>Stuti corpus</h1>
  <input id="q" placeholder="search title, file, folder">
  <div id="list"></div>
  <div id="sidebarfoot"></div>
</div>

<div id="main">
  <div id="bar">
    <span class="grp">
      <label><input type="checkbox" class="sc" value="deva" checked> Devanāgarī</label>
      <label><input type="checkbox" class="sc" value="iast" checked> IAST</label>
      <label><input type="checkbox" class="sc" value="telscript"> Telugu script <span style="opacity:.7">(generated)</span></label>
      <label><input type="checkbox" id="svara"> keep svara marks in it <span style="opacity:.7">(no Telugu font draws them)</span></label>
    </span>
    <span class="grp">
      <label><input type="checkbox" class="mc" value="en" checked> English</label>
      <label><input type="checkbox" class="mc" value="tel" checked> Telugu</label>
      <label><input type="checkbox" class="mc" value="hi" checked> Hindi</label>
    </span>
    <span class="grp">
      <label><input type="checkbox" id="apparatus" checked> show apparatus</label>
      <label>show <select id="kind">
        <option value="">all texts</option>
        <option value="text">text issues only (count · lines · colon · missing)</option>
        <option value="leak">sourcing in a reader field</option>
        <option value="reserved">reserved placeholders</option>
      </select></label>
    </span>
  </div>
  <div id="body"><div id="hint">
    Pick a text on the left. <kbd>↑</kbd><kbd>↓</kbd> move between texts,
    <kbd>j</kbd><kbd>k</kbd> between verses, <kbd>/</kbd> jumps to search.
    The tick boxes above choose which scripts and which meanings are shown side by side.
    Everything inside <i>apparatus</i> is withheld from the reader.
  </div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let rows = [], shown = [], cur = -1, doc = null, curUnit = -1;

const esc = s => (s||"").replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

fetch('/api/index').then(r=>r.json()).then(d=>{ rows = d; draw(); });

function draw(){
  const q = $('#q').value.trim().toLowerCase();
  const kind = $('#kind').value;
  const TEXTKINDS = ['count','lines','colon','missing','number'];
  const keep = r => !kind ? true
    : kind === 'text' ? r.kinds.some(k => TEXTKINDS.includes(k))
    : r.kinds.includes(kind);
  shown = rows.filter(r =>
    keep(r) &&
    (!q || (r.path+' '+r.title+' '+r.deva+' '+r.telugu).toLowerCase().includes(q)));
  let html = '', fold = null;
  shown.forEach((r,i) => {
    if (r.folder !== fold){ fold = r.folder; html += `<div class="fold">${esc(fold)}</div>`; }
    const hard = r.kinds.filter(k => ['count','lines','colon','missing','number'].includes(k));
    html += `<div class="row${i===cur?' on':''}" data-i="${i}">`
         +  `<span class="t">${esc(r.title)}</span>`
         +  (hard.length ? `<span class="badge hard">${esc(hard.join(' '))}</span>` : '')
         +  (r.kinds.includes('reserved') ? `<span class="badge">reserved</span>` : '')
         +  `<span class="n">${r.units}</span></div>`;
  });
  $('#list').innerHTML = html;
  $('#sidebarfoot').textContent =
    `${shown.length} of ${rows.length} texts · ${rows.reduce((a,r)=>a+r.flags,0)} observations`;
}

$('#list').addEventListener('click', e => {
  const row = e.target.closest('.row');
  if (row) open(+row.dataset.i);
});
$('#q').addEventListener('input', draw);
$('#kind').addEventListener('change', draw);
$('#apparatus').addEventListener('change', render);
document.querySelectorAll('.sc,.mc').forEach(c => c.addEventListener('change', render));
$('#svara').addEventListener('change', render);

function open(i){
  if (i < 0 || i >= shown.length) return;
  cur = i; curUnit = -1; draw();
  document.querySelector('.row.on')?.scrollIntoView({block:'nearest'});
  fetch('/api/file?p=' + encodeURIComponent(shown[i].path))
    .then(r=>r.json()).then(d => { doc = d; render(); $('#main').scrollTop = 0; });
}

// The generated Telugu carries the Devanāgarī-block svara marks straight over from the source
// line. They are faithful, but most Telugu fonts place them badly, so they are off by default.
const SVARA = /[\u0951\u0952\u1CD0-\u1CE1\u1CF4\u1CF8\u1CF9]/g;
function tel(s){ return (!s || $('#svara').checked) ? s : s.replace(SVARA, ''); }

function picked(cls){ return [...document.querySelectorAll('.'+cls)].filter(c=>c.checked).map(c=>c.value); }

function cell(label, cls, text){
  return `<div class="cell"><div class="lab">${label}</div>`
       + (text ? `<div class="${cls}">${esc(text)}</div>` : `<div class="empty">— absent —</div>`)
       + `</div>`;
}

function render(){
  if (!doc) return;
  const R = doc.reader, sc = picked('sc'), mc = picked('mc');
  const LS = {deva:['Devanāgarī','deva'], iast:['IAST','iast'],
              telscript:['Telugu script · generated, not corpus text','telscript']};
  const LM = {en:['English','prose'], tel:['Telugu','prose telugu'], hi:['Hindi','prose']};

  let h = `<div class="wrap" style="--sc:${Math.max(sc.length,1)};--mc:${Math.max(mc.length,1)}">`;
  h += `<h2>${esc(R['Title']||doc.path)}</h2>`;
  if (R['Devanāgarī']) h += `<div class="sub deva" style="font-size:22px">${esc(R['Devanāgarī'])}</div>`;
  if (R['Telugu'])     h += `<div class="sub telscript">${esc(R['Telugu'])}</div>`;
  const bits = [doc.path, R['Author'] && 'Author: '+R['Author'], R['Type'],
                `${doc.units.length} units`].filter(Boolean);
  h += `<div class="meta">${esc(bits.join('  ·  '))}</div>`;
  if (R['Sections']) h += `<div class="meta" style="white-space:pre-wrap">${esc(R['Sections'])}</div>`;
  if (R['Language'])  h += `<div class="meta" style="white-space:pre-wrap">Language: ${esc(R['Language'])}</div>`;
  if (R['Blurb'])     h += `<div class="blurb">${esc(R['Blurb'])}</div>`;

  if (doc.checks.length){
    h += `<div class="flags"><b>${doc.checks.length} thing${doc.checks.length>1?'s':''} to look at</b><ul>`
       + doc.checks.map(([s,m]) => `<li><b style="display:inline">${esc(s)}</b> — ${esc(m)}</li>`).join('')
       + `</ul></div>`;
  }
  if ($('#apparatus').checked && Object.keys(doc.editorial).length){
    h += `<details class="app" open><summary>Apparatus — withheld from the reader</summary><div class="appbody">`
       + Object.entries(doc.editorial).map(([k,v]) =>
           `<div class="f"><b>${esc(k)}</b><div>${esc(v)}</div></div>`).join('')
       + `</div></details>`;
  }

  doc.units.forEach((u,i) => {
    h += `<div class="unit" id="u${i}" data-u="${i}"><div class="uh">unit ${i+1}</div>`;
    if (sc.length) h += `<div class="scripts">` + sc.map(k =>
        cell(LS[k][0], LS[k][1], k === 'telscript' ? tel((doc.telscript||[])[i]) : u[k])).join('') + `</div>`;
    if (u.variant) h += `<div class="variant deva">variant: ${esc(u.variant)}</div>`;
    if (u.vidhi)   h += `<div class="vidhi">${esc(u.vidhi)}</div>`;
    if (mc.length) h += `<div class="mean">` + mc.map(k => cell(LM[k][0], LM[k][1], u[k])).join('') + `</div>`;
    h += `</div>`;
  });
  h += `</div>`;
  $('#body').innerHTML = h;
  $('#body').addEventListener('click', e => {
    const u = e.target.closest('.unit');
    if (u) mark(+u.dataset.u);
  });
  if (curUnit >= 0) mark(curUnit);
}

function mark(i){
  document.querySelectorAll('.unit.on').forEach(e => e.classList.remove('on'));
  const el = document.getElementById('u'+i);
  if (!el) return;
  curUnit = i; el.classList.add('on');
  el.scrollIntoView({block:'nearest', behavior:'smooth'});
}

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT'){
    if (e.key === 'Escape') e.target.blur();
    return;
  }
  if (e.key === '/'){ e.preventDefault(); $('#q').focus(); return; }
  if (e.key === 'ArrowDown' || e.key === ']'){ e.preventDefault(); open(cur+1); }
  if (e.key === 'ArrowUp'   || e.key === '['){ e.preventDefault(); open(cur-1); }
  if (e.key === 'j' && doc) mark(Math.min(curUnit+1, doc.units.length-1));
  if (e.key === 'k' && doc) mark(Math.max(curUnit-1, 0));
  if (e.key === 'a'){ $('#apparatus').checked = !$('#apparatus').checked; render(); }
});
</script>
