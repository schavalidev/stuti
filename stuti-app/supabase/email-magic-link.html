<!-- Supabase → Authentication → Emails → Magic Link.
     The app asks for six digits, not a link: stuti-cloud.ts sends with
     signInWithOtp and reads them back with verifyOtp, so the body must show
     {{ .Token }} and must not lead with {{ .ConfirmationURL }}. Kept here so
     the wording is in the repository and not only in the dashboard.
     Subject: Your Stuti sign-in code -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="background:#faf7f2;padding:32px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:440px;background:#ffffff;border:1px solid #e8e0d4;
                    border-radius:10px;padding:32px;
                    font-family:Georgia,'Times New Roman',serif;color:#2b2520;">
        <tr>
          <td style="font-size:20px;letter-spacing:0.08em;color:#8a6a3b;
                     padding-bottom:20px;">STUTI</td>
        </tr>
        <tr>
          <td style="font-size:16px;line-height:1.6;padding-bottom:24px;">
            Namaste. Here is your sign-in code.
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <div style="font-family:Menlo,Consolas,monospace;font-size:32px;
                        letter-spacing:0.22em;color:#2b2520;background:#faf7f2;
                        border:1px solid #e8e0d4;border-radius:8px;
                        padding:16px 20px;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="font-size:15px;line-height:1.6;padding-bottom:20px;">
            Type these six digits into the app to sign in. The code is good for
            one hour, and for one use.
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:1.6;color:#6b6054;
                     border-top:1px solid #e8e0d4;padding-top:20px;">
            If you did not ask to sign in, nothing has happened and you may
            ignore this message. No one can use the code but you.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
