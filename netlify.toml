# Netlify builds the web app from stuti-app/ (used both by `netlify deploy`
# from the repo root and by a site linked to the GitHub repo, where every
# push to main redeploys). The app routes by URL hash, so no SPA fallback
# rule is needed.
[build]
  base = "stuti-app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# The service worker must never be served stale, or a deploy can't reach
# devices that already have the previous one installed.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
